name: Build TestDPC APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build TestDPC APK with Bazel
        run: bazel build //:testdpc
      - name: Copy APK and Get Signature Checksum
        run: |
          mkdir -p output
          APK_PATH=$(find -L bazel-bin -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" output/testdpc-testonly.apk
          CERT_HEX=$(keytool -printcert -jarfile output/testdpc-testonly.apk | grep "SHA256:" | awk '{print $2}' | tr -d ':')
          echo "URL-Safe Base64 Checksum:"
          echo "$CERT_HEX" | xxd -r -p | base64 | tr '+/' '-_'
      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: TestDPC TestOnly
          files: output/testdpc-testonly.apk
