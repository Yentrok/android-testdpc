name: Build TestDPC APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build TestDPC APK with Bazel
        run: bazel build //:testdpc
      - name: Get APK Signature Checksum
        run: |
          APK_PATH=$(find bazel-bin -name "*testdpc*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          CERT_HEX=$(keytool -printcert -jarfile "$APK_PATH" | grep "SHA256:" | awk '{print $2}' | tr -d ':')
          echo "URL-Safe Base64 Checksum:"
          echo "$CERT_HEX" | xxd -r -p | base64 | tr '+/' '-_'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testdpc-testonly-apk
          path: bazel-bin/**/*testdpc*.apk
